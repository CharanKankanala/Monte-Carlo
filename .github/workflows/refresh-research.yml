name: Refresh market research

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python research_pipeline.py --refresh --paths 10000
      - name: Commit refreshed dataset and dashboard payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_prices.csv dashboard/public/results.json
          git diff --cached --quiet || git commit -m "Refresh weekly market research"
          git push

